<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jules Demo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>QA Demo Login</h1>
      <p class="subtitle">Simple UI + API sample for Playwright and RestSharp testing.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="qa.user@example.com" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" value="Password123!" autocomplete="current-password" required />

        <button id="loginButton" type="submit">Sign in</button>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="credentials">
        <h2>Demo credentials</h2>
        <code>qa.user@example.com / Password123!</code>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
